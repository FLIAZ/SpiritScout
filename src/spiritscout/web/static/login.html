<!doctype html>
<html lang="zh-CN" data-motion="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script defer src="/static/js/i18n.en.js?v=20261107-en"></script>
<script defer src="/static/js/i18n.js?v=20261108-language-icon"></script>
<title>登录 · 灵枢 SpiritScout</title>
<script>
try {
  const t = localStorage.getItem("ss-theme");
  if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
} catch {}
</script>
<link rel="stylesheet" href="/static/css/base.css?v=20261119-motion-audit">
<link rel="stylesheet" href="/static/css/views.css?v=20261119-motion-audit">
<link rel="stylesheet" href="/static/css/login.css?v=20261119-motion-audit">
<link rel="stylesheet" href="/static/css/i18n.css?v=20261108-language-icon">
<link rel="stylesheet" href="/static/css/motion.css?v=20261119-motion-audit">
<script defer src="/static/js/motion.js?v=20261119-motion-audit"></script>
</head>
<body class="login-body">
<main class="login-wrap">
  <section class="card login-card" aria-labelledby="login-title">
    <div class="login-language"><button class="language-switch" type="button" data-language-toggle lang="en">English</button></div>
    <p class="login-eyebrow">SpiritScout · Access Control</p>
    <h1 id="login-title" class="login-title">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true" focusable="false"><path d="M27 4H12l-8 8v6h6v-4l4-4h13Z"/><path class="brand-mark-accent" d="M5 28h15l8-8v-6h-6v4l-4 4H5Z"/></svg>
      <span class="brand-wordmark"><span class="brand-name" data-brand-zh>灵枢</span><span class="brand-caption" lang="en">SpiritScout</span></span>
    </h1>
    <p class="login-sub">渗透测试智能体集群 · 管理控制台</p>

    <form id="login-form" novalidate>
      <label class="login-field">
        <span>管理员</span>
        <input id="login-user" name="username" type="text" autocomplete="username"
               spellcheck="false" required autofocus>
      </label>
      <label class="login-field">
        <span>密码</span>
        <span class="login-pw">
          <input id="login-pass" name="password" type="password"
                 autocomplete="current-password" required>
          <button id="login-pw-toggle" class="login-pw-toggle" type="button"
                  aria-label="显示密码" aria-pressed="false">显示</button>
        </span>
      </label>
      <p id="login-error" class="login-error" role="alert" aria-live="polite" hidden></p>
      <button id="login-submit" class="login-submit" type="submit">进入控制台</button>
    </form>
  </section>
</main>
<script defer src="/static/js/login.js?v=20261107-en"></script>
</body>
</html>
