name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m ruff check src/spiritscout tests
      - run: python -m compileall -q src/spiritscout tests
      - run: python -m unittest discover -s tests -v
      - name: Check browser scripts
        run: |
          for file in src/spiritscout/web/static/js/*.js; do node --check "$file" || exit; done
          for file in tests/test_*.js; do node "$file" || exit; done
