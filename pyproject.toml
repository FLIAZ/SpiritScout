[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiritscout"
version = "0.1.0"
description = "灵探（SpiritScout）渗透测试智能体系统 —— 主Agent集中决策 + 环形子Agent集群 + 黑板架构 + 漏洞全链路核验"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "litellm>=1.60",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",      # M5.5 Web 控制台（J20）
    "uvicorn>=0.30",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
nats = ["nats-py>=2.6"]
chroma = ["chromadb>=1.0"]
report = ["weasyprint>=62", "python-docx>=1.1"]

[project.scripts]
spiritscout = "spiritscout.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spiritscout = ["web/static/*.html"]
