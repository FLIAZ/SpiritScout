[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiritscout"
version = "0.1.0"
description = "灵探（SpiritScout）渗透测试智能体系统 —— 主Agent集中决策 + 环形子Agent集群 + 黑板架构 + 漏洞全链路核验"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "litellm>=1.60",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "fastapi>=0.115",      # Web 控制台
    "uvicorn>=0.30",
    "cryptography>=42",    # 密钥库加密（Fernet）
    "mcp>=1.20,<2",        # 外部 MCP 工具服务器客户端（ida/yakit 等接入）
]

[project.optional-dependencies]
toolkit = [
    "pwntools>=4.12",       # 交互/构造/exploit 基建
    "pycryptodome>=3.20",   # 现代密码学原语
    "pillow>=10.0",         # 图像解析与 LSB 隐写
    "sympy>=1.13",          # 数学求解（RSA/离散结构）
    "gmpy2>=2.1",           # 大整数快速运算
    "z3-solver>=4.13",      # 约束求解（逆向/密码）
    "scapy>=2.6",           # 流量构造与解析
    "exifread>=3.0",        # 图片元数据
    "stegano>=0.11",        # LSB 隐写
    "olefile>=0.46",        # Office 文档结构
    "binwalk>=2.1",         # 固件/文件嵌入扫描
    "sqlmap>=1.8",          # SQL 注入自动化
]
redis = ["redis>=5.0"]
nats = ["nats-py>=2.6"]
chroma = ["chromadb>=1.0"]
report = ["weasyprint>=62", "python-docx>=1.1"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
spiritscout = "spiritscout.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spiritscout = ["web/static/*.html"]
