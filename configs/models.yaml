# 模型注册表（设计书 4.9.4，硬约束 C9：OpenAI/Anthropic 兼容 API）。
# 本文件可被 Web 控制台「模型」面板写回（手写注释会被规范化；完整注释模板见
# configs/models.example.yaml）。密钥不落本文件（G8）——在 Web「模型」页直填，
# 加密存入本机密钥库。
providers:
- name: ark
  provider: openai_compatible
  base_url: https://ark.cn-beijing.volces.com/api/plan/v3
  api_key: ''
- name: zhipu
  provider: anthropic_compatible
  base_url: https://open.bigmodel.cn/api/anthropic
  api_key: ''
- name: agentrouter_cn
  provider: openai_compatible
  base_url: https://ps.air-outer.com
  api_key: ''
models:
- model: ark-code-latest
  provider_ref: ark
  tier: flagship
  context_window: 0
  reasoning_effort_levels:
  - low
  - medium
  - high
  - xhigh
  - max
  capabilities:
  - reasoning
  - code
  - chinese
  - security
  cost_input_per_mtok: 0.8
  cost_output_per_mtok: 2
  rate_limit_rpm: 300
  quality_score: 1
  is_fallback_for: []
- model: glm-5.3
