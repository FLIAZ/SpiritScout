  #   provider: anthropic_compatible
  #   model: claude-sonnet-4-5
  #   base_url: https://api.anthropic.com      # 或你的中转端点
  #   api_key: ${ANTHROPIC_API_KEY}
  #   tier: flagship
  #   capabilities: [reasoning, code, security]
  #   quality_score: 1.0
