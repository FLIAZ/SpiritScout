# 灵枢（SpiritScout）系统配置示例
# 复制为 configs/system.yaml 后修改；亦可用 SPIRITSCOUT_<段>__<键> 环境变量覆盖。

mode: src                      # src / ctf / competition（三模式， 完整启用）

workspace:
  root: .spiritscout           # 工作区（SQLite/审计/报告）

bus:                           # 环形数据总线（适配器决策 A1）
  backend: inprocess           # inprocess（默认）/ redis / nats
  redis_url: redis://127.0.0.1:6379/0
  redis_url_env: SPIRITSCOUT_REDIS_URL # 优先读环境变量，密码不要写入配置
  namespace: spiritscout          # 不同部署须配置不同命名空间；会话自动隔离
  connect_timeout_seconds: 5
  shared_request_rps: 10           # Redis 模式同一部署所有内置探测请求的合计速率
  nats_url: nats://127.0.0.1:4222
  queue_maxsize: 10000
  rate_limit_per_second: 1000  # 总线流量控制

blackboard:
  sqlite_path: .spiritscout/blackboard.db

gateway:                       # 多模型网关（模型在 models.yaml 注册）
  default_tier: fast
  budget_tokens: 2000000       # token 预算硬顶（超顶熔断）
  budget_usd: 20.0
  cascade_confidence_threshold: 0.8
  vote_min_models: 2
  request_timeout_seconds: 300  # 重推理模型单次调用可达数分钟，过短会中途掐死解题环
  max_retries: 2

executor:                      # 工具执行器（CLI/Docker/MCP 三态）
  backend: local               # local / docker
  docker_image: kalilinux/kali-rolling:latest
  default_timeout_seconds: 300
  max_output_chars: 20000      # 输出窗口截断（防上下文污染）
  ctf_network_isolation: true  # CTF 模式网络隔离（硬约束）

knowledge:                     # 五库 + 两经验库
  sqlite_path: .spiritscout/knowledge.db
  chroma_path: .spiritscout/chroma
  embedding_provider: hash     # hash（零依赖默认）/ openai_compatible
  embedding_base_url: ""
  embedding_api_key: ${EMBEDDING_API_KEY}
  embedding_model: ""

report:
  template: src_standard       # 报告模板（4.6.2）
  output_format: markdown
  output_dir: .spiritscout/reports

web:
  host: 127.0.0.1
  port: 8000
  max_concurrent_sessions: 4
  remote_auth_required: true     # 非回环绑定无密码时拒绝启动
  password_env: SPIRITSCOUT_SERVER_PASSWORD

models_config_path: configs/models.yaml
audit_log_path: .spiritscout/audit.jsonl

# 可选浏览器 MCP：显式启用后，导航只读；其他状态变更仍需即时审批。
mcp_servers:
  - name: playwright
    enabled: false
    command: npx
    args: ["@playwright/mcp@latest", "--headless", "--snapshot-boxes"]
    default_risk: intrusive
    tool_risk_overrides:
      browser_navigate: readonly
    scope_enforcement: required

max_routes_per_agent: 8        # 分支数硬上限（防分支爆炸）
default_routes_per_agent: 3    # 默认 3 条差异化路线（硬约束 C2）
