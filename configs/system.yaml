# 灵枢（SpiritScout）系统配置示例
# 复制为 configs/system.yaml 后修改；亦可用 SPIRITSCOUT_<段>__<键> 环境变量覆盖。

mode: src                      # src / ctf / competition（三模式， 完整启用）

workspace:
  root: .spiritscout           # 工作区（SQLite/审计/报告）

bus:                           # 环形数据总线（适配器决策 A1）
  backend: inprocess           # inprocess（默认）/ redis / nats
  redis_url: redis://127.0.0.1:6379/0
  nats_url: nats://127.0.0.1:4222
  queue_maxsize: 10000
  rate_limit_per_second: 1000  # 总线流量控制

blackboard:
  sqlite_path: .spiritscout/blackboard.db

gateway:                       # 多模型网关（模型在 models.yaml 注册）
  budget_tokens: 2000000       # Token 用量参考值，仅计量不熔断
  budget_usd: 20.0
  mode_budget_tokens:          # 按模式记录的 Token 参考值，不作为执行上限
    src: 2000000
    ctf: 1000000
    competition: 1500000
  degrade_at_ratio: 0.8        # 兼容旧配置；当前不按消耗自动降级
  cascade_confidence_threshold: 0.8
  vote_min_models: 2
  request_timeout_seconds: 300  # 重推理模型单次调用可达数分钟，过短会中途掐死解题环
  max_retries: 2

executor:                      # 工具执行器（CLI/Docker/MCP 三态）
  backend: local               # local / docker
  docker_image: kalilinux/kali-rolling:latest
  default_timeout_seconds: 300
  max_output_chars: 20000      # 输出窗口截断（防上下文污染）
  ctf_network_isolation: true  # CTF 模式网络隔离（硬约束）
  docker_memory_mb: 512        # Docker 沙箱加固：资源硬限额
  docker_cpus: 1.0
  docker_pids_limit: 256
  docker_read_only: true       # 只读根文件系统 + 受限 tmpfs
  docker_tmpfs: "/tmp:rw,noexec,nosuid,size=64m"
  docker_user: ""              # 空 = 镜像默认用户；可配 "65534:65534" 降权

knowledge:                     # 五库 + 两经验库
  sqlite_path: .spiritscout/knowledge.db
  chroma_path: .spiritscout/chroma
  embedding_provider: hash     # hash（零依赖默认）/ openai_compatible
  embedding_base_url: ""
  embedding_api_key: ""        # 启用远端 embedding 时可设为 ${EMBEDDING_API_KEY}
  embedding_model: ""

experience:                    # 经验库（跨会话自我进化）：收尾提炼 + 开工召回
  root: ""                     # 空=跟随工作区；Web 控制台自动指向共享目录
  distill_timeout_seconds: 45  # 收尾提炼单次 LLM 硬顶（秒），仅终态路径使用
  recall_limit: 6              # 会话开工注入的经验条数上限

report:
  template: src_standard       # 报告模板（4.6.2）
  output_format: markdown
  output_dir: .spiritscout/reports

web:                            # Web 控制台：spiritscout 启动
  host: 127.0.0.1               # 非回环绑定时必须设置下方环境变量对应的管理密码
  port: 8000
  max_concurrent_sessions: 4    # 并发会话上限
  remote_auth_required: true
  password_env: SPIRITSCOUT_SERVER_PASSWORD

models_config_path: configs/models.yaml
audit_log_path: .spiritscout/audit.jsonl

max_routes_per_agent: 8        # 分支数硬上限（防分支爆炸）
default_routes_per_agent: 3    # 默认 3 条差异化路线（硬约束 C2）
# 外部 MCP 服务器接入：工具以 mcp__<名>__<工具> 并入智能体工具目录，服务器
# 不可达时留痕跳过、不阻断开工。传输三态：stdio（子进程）/ http（Streamable
# HTTP 单端点）/ sse（旧版 SSE 长连接）。前两项随项目封装、开箱即用：
mcp_servers:
  - name: ida                     # 逆向：反编译 / 交叉引用 / 函数与类型检索（无头 idalib）
    transport: stdio
    command: .venv/bin/idalib-mcp # 相对路径按项目根解析；绝对路径或 PATH 命令原样使用
    args: ["--stdio"]
    timeout: 600                  # 大型二进制自动分析可跑数分钟
    default_risk: readonly        # 只读分析；可能修改环境的提示按侵入性能力处理（调用时声明行为）
    scope_enforcement: none       # 仅分析会话附件，不触网
  - name: yakit                   # Web 渗透：编解码 / HTTP 流量 / 模糊测试 / 指纹 / 端口 / 反序列化
    transport: stdio
    command: .tools/yak/yak       # 项目自带 Yakit 引擎（无头运行，不依赖图形端）
    args: ["mcp"]                 # 需要全部工具集时加 "--enable-all"
    timeout: 300
    default_risk: intrusive       # 网络探测类能力：调用时逐次声明本次行为，仅危险语义即时审批
    scope_enforcement: required   # 参数无法给出可校验目标时默认拒绝
  - name: playwright              # 浏览器自动化：JS 渲染页面真实 DOM / 点击 / 表单 / 截图
    transport: stdio
    command: npx
    args: ["@playwright/mcp@latest", "--headless", "--snapshot-boxes"]  # 快照附元素坐标，辅助判断视口外目标
    timeout: 120
    default_risk: readonly        # 普通浏览器操作不按工具能力判危险
    risk_by_action: true          # 模型声明本次实际行为，危险操作执行前逐次审批
    scope_enforcement: required   # 导航目标必须在授权范围内

# —— idalib 装配（一次性，项目根执行；<IDA> 为 IDA Pro 安装目录）：
#   .venv/bin/pip install <IDA>/idalib/python/idapro-*.whl
#   .venv/bin/pip install --no-deps https://github.com/mrexodia/ida-pro-mcp/archive/refs/heads/main.zip
#   .venv/bin/python3 <IDA>/idalib/python/py-activate-idalib.py -d <IDA>
#   逆向工具带 database 参数，先用 idb_open 打开目标（库文件 .i64 生成在目标
#   文件旁，目标需位于可写目录）；idb_open 的 mode=prefer_gui 可接管 IDA 图形端。
# —— Yakit 引擎提取（一次性，来自官方 AppImage）：
#   ./Yakit-*.AppImage --appimage-extract → squashfs-root/bins/yak.zip
#   解出 bins/yak_linux_amd64 放入 .tools/yak/yak 并 chmod +x
#   图形端「设置 → MCP」开启后亦可改走 http://127.0.0.1:11432/mcp（以应用内为准）。
# —— 其余常见接入（按需启用；外部依赖，不随项目封装）：
#   - name: pentest             # 一站式渗透工具箱：235 工具合一（nmap/nuclei/sqlmap/ffuf/impacket/hydra…）
#     transport: stdio          #   官方无预构建镜像，本地自建：git clone github.com/halilkirazkaya/pentester-mcp
#     command: docker           #   docker compose up -d --build 使容器常驻（容器名 pentester-mcp，Kali 底）
#     args: ["exec", "-i", "pentester-mcp", "/app/.venv/bin/python", "/app/server.py"]
#     timeout: 600              #   扫描类工具耗时长；工具档位由容器环境 MCP_CONFIG_PATH 选择
#                               #   （example=1 / recon=28 / web=49 / full=235）
#   - name: burp                # Web 漏洞扫描与模糊测试（PortSwigger 官方扩展；需 Burp 图形端常驻）
#     transport: sse            #   官方 SSE 端点即根路径 http://127.0.0.1:9876（不带 /sse）
#     url: http://127.0.0.1:9876
#   - name: wire                # 流量/数据包分析（WireMCP；需系统 tshark，无 npm 包）
#     transport: stdio          #   git clone github.com/0xKoda/WireMCP && npm install 后：
#     command: node
#     args: ["<WireMCP 克隆目录>/index.js"]
#   - name: shodan              # 资产情报（出网至第三方服务；密钥由启动环境注入，不落 YAML）
#     transport: stdio
#     command: npx
#     args: ["-y", "@burtthecoder/mcp-shodan"]
#     env: { SHODAN_API_KEY: "${SHODAN_API_KEY}" }
#   - name: virustotal          # 文件/域名情报（VirusTotal 官方托管端点，样本细节出网）
#     transport: http
#     url: https://ai.virustotal.com/mcp

# 秘书由灵枢按需要咨询；模型可在编队页单独指派，无工具权限。
secretary:
  enabled: true

# 共享资源目录：留空时使用主工作区 resources/，会话隔离前固定路径。
resources:
  root: ""
  freshness_hours: 24
  npm_registry: https://registry.npmjs.org
