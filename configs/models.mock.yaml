# Mock 模型注册表——仅供研发/测试（合规 G10：测试不触网）。
# 真实使用请改 configs/models.yaml（云端模型模板），
# 或 spiritscout --config <system.yaml> 中 models_config_path 指向本文件做离线开发。
# Mock 后端是确定性应答（支持故障注入），不消耗真实 API、不产生真实智能。

providers:
  - name: mock
    provider: mock

models:
  - model: mock-flagship
    provider_ref: mock
    capabilities: [reasoning, code, chinese, security]
    context_window: 200000
    reasoning_effort_levels: [low, medium, high]
    cost_input_per_mtok: 0.0
    cost_output_per_mtok: 0.0
    rate_limit_rpm: 600
    quality_score: 1.0

  - model: mock-fast
    provider_ref: mock
    capabilities: [chinese]
    context_window: 128000
    reasoning_effort_levels: [low, high]
    cost_input_per_mtok: 0.0
    cost_output_per_mtok: 0.0
    rate_limit_rpm: 600
    quality_score: 0.9

  - model: mock-code
    provider_ref: mock
    capabilities: [code]
    context_window: 128000
    reasoning_effort_levels: []
    cost_input_per_mtok: 0.0
    cost_output_per_mtok: 0.0
    rate_limit_rpm: 600
    quality_score: 0.95

  - model: mock-rigorous
    provider_ref: mock
    capabilities: [reasoning, chinese, security]
    context_window: 200000
    reasoning_effort_levels: [low, medium, high, ultra]
    cost_input_per_mtok: 0.0
    cost_output_per_mtok: 0.0
    rate_limit_rpm: 600
    quality_score: 0.98

  - model: mock-backup
    provider_ref: mock
    capabilities: [chinese]
    context_window: 128000
    reasoning_effort_levels: []
    cost_input_per_mtok: 0.0
    cost_output_per_mtok: 0.0
    rate_limit_rpm: 600
    quality_score: 0.8
    is_fallback_for: [mock-fast]
